<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EdgePlay 游戏试玩详情页 (Cinema Player)</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Space+Grotesk:wght@600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}}
::-webkit-scrollbar{display:none;}
@keyframes retro-blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
.animate-retro-blink{animation:retro-blink 1s infinite;}
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#ffedc3",
        "primary-container": "#ffcc00",
        "on-primary-container": "#6f5700",
        "secondary": "#ffb2b8",
        "secondary-container": "#ff506e",
        "tertiary": "#bbffbb",
        "tertiary-container": "#00f260",
        "surface": "#12121d",
        "surface-container-lowest": "#0d0d17",
        "surface-container-low": "#1b1b25",
        "surface-container": "#1f1f29",
        "surface-container-high": "#292934",
        "console-surface": "#161626",
        "stepped-border": "#2E2E48",
        "cyber-cyan": "#00E5FF",
        "gold-foil": "#FFD700"
      },
      fontFamily: {
        "display": ["Space Grotesk"],
        "headline-sm": ["Space Grotesk"],
        "headline-md": ["Space Grotesk"],
        "headline-lg": ["Space Grotesk"],
        "body-md": ["Inter"],
        "body-lg": ["Inter"],
        "label-sm": ["Space Mono"],
        "label-md": ["Space Mono"],
        "label-lg": ["Space Mono"]
      }
    }
  }
};
</script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen">
<header class="bg-surface-container-lowest border-b-4 border-stepped-border py-4 px-6 flex items-center justify-between">
  <div class="flex items-center gap-4">
    <a href="home_discovery_hub.html" class="inline-flex items-center gap-2 px-3 py-1.5 bg-console-surface text-primary font-label-md text-xs uppercase border-2 border-stepped-border shadow-[2px_2px_0px_#000000] hover:text-cyber-cyan hover:border-cyber-cyan">
      <span class="material-symbols-outlined text-sm">arrow_back</span>
      <span>&lt; 返回游戏大厅</span>
    </a>
    <span class="font-headline-sm text-lg text-primary-container font-bold">SPACE DEFENDER DX</span>
  </div>
  <div class="flex items-center gap-3">
    <span class="bg-surface-container-high px-3 py-1 border border-stepped-border font-label-sm text-xs text-tertiary-container">
      <span class="inline-block w-2 h-2 rounded-full bg-tertiary-container animate-pulse mr-1"></span> CLOUD SAVE: SYNCED
    </span>
  </div>
</header>
<main class="max-w-[1440px] mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
  <div class="lg:col-span-8 flex flex-col gap-4">
    <!-- CRT Monitor Cabinet Enclosure -->
    <div class="relative bg-console-surface border-4 border-stepped-border shadow-[6px_6px_0px_#000000] p-4">
      <div class="relative bg-black aspect-video flex items-center justify-center border-2 border-stepped-border overflow-hidden shadow-[inset_0_0_24px_rgba(0,0,0,0.9)]">
        <!-- CRT Scanline Screen Overlay -->
        <div class="absolute inset-0 pointer-events-none opacity-20 bg-[linear-gradient(rgba(18,18,29,0)_50%,rgba(0,0,0,0.75)_50%)] bg-[length:100%_4px] z-10"></div>
        <iframe id="game-frame" src="about:blank" class="w-full h-full border-none z-0" sandbox="allow-scripts allow-same-origin allow-pointer-lock allow-fullscreen"></iframe>
        <div class="absolute z-20 text-center pointer-events-none">
          <div class="text-4xl text-primary-container font-display uppercase font-bold drop-shadow-[2px_2px_0px_#000]">SPACE DEFENDER DX</div>
          <div class="text-sm font-label-md text-tertiary-container mt-2">CLICK 'START GAME' TO LAUNCH EMULATION</div>
        </div>
      </div>
      <!-- Controls Strip -->
      <div class="flex flex-wrap items-center justify-between gap-3 mt-4 pt-3 border-t-2 border-stepped-border font-label-sm text-xs">
        <div class="flex items-center gap-2">
          <button class="px-4 py-2 bg-primary-container text-black font-bold uppercase border border-black shadow-[2px_2px_0px_#000] active:translate-x-0.5 active:translate-y-0.5 flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">fullscreen</span> 全屏模式
          </button>
          <button class="px-4 py-2 bg-console-surface text-gray-300 uppercase border border-stepped-border shadow-[2px_2px_0px_#000] flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">volume_up</span> 静音/音量
          </button>
          <button class="px-4 py-2 bg-console-surface text-gray-300 uppercase border border-stepped-border shadow-[2px_2px_0px_#000] flex items-center gap-1">
            <span class="material-symbols-outlined text-sm">restart_alt</span> 重启
          </button>
        </div>
        <div class="text-gray-400 font-label-sm">
          按键: <span class="text-cyber-cyan font-bold">[W/A/S/D]</span> 移动 | <span class="text-secondary-container font-bold">[J/K]</span> 攻击/跳跃
        </div>
      </div>
    </div>
  </div>
  <!-- Right Sidebar: Leaderboard & Related -->
  <div class="lg:col-span-4 flex flex-col gap-4">
    <div class="bg-surface-container-lowest border-4 border-stepped-border p-4 shadow-[6px_6px_0px_#000]">
      <div class="font-headline-sm text-base text-primary-container font-bold pb-2 border-b border-stepped-border flex items-center gap-2 mb-3">
        <span class="material-symbols-outlined text-gold-foil">military_tech</span> 本局实时排行榜 (D1)
      </div>
      <div class="space-y-2 font-label-md text-xs">
        <div class="flex justify-between p-2 bg-console-surface border border-stepped-border">
          <span class="text-gold-foil font-bold">#1 👑 STARFIGHTER X</span>
          <span class="text-tertiary-container font-bold">1,245,670</span>
        </div>
        <div class="flex justify-between p-2 bg-console-surface border border-stepped-border">
          <span class="text-gray-300 font-bold">#2 🥈 PIXEL_PILOT</span>
          <span class="text-tertiary-container font-bold">987,410</span>
        </div>
        <div class="flex justify-between p-2 bg-console-surface border border-stepped-border">
          <span class="text-amber-600 font-bold">#3 🥉 BLAST_MASTER</span>
          <span class="text-tertiary-container font-bold">762,300</span>
        </div>
      </div>
    </div>
    <div class="bg-surface-container-lowest border-4 border-stepped-border p-4 shadow-[6px_6px_0px_#000]">
      <div class="font-headline-sm text-base text-primary-container font-bold pb-2 border-b border-stepped-border mb-3">
        🎮 相似街机投币推荐
      </div>
      <div class="space-y-3">
        <div class="flex items-center gap-3 p-2 bg-console-surface border border-stepped-border">
          <div class="w-12 h-12 bg-gray-800 flex items-center justify-center font-bold text-xs text-cyber-cyan border border-stepped-border">8-BIT</div>
          <div class="flex-1">
            <div class="font-headline-sm text-sm text-white font-bold">Astro Assault</div>
            <div class="text-xs text-gray-400 font-label-sm">⭐ 4.8 | 89k 玩过</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
