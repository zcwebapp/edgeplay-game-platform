<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber T-Rex Runner</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a14;
      color: #ff0055;
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .game-box {
      background: #12121d;
      border: 3px solid #2e2e48;
      box-shadow: 4px 4px 0px #000;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
    }
    .hud-hi { color: #8888aa; }
    .hud-score { color: #00ff66; text-shadow: 0 0 6px #00ff66; }
    canvas {
      background: #050510;
      border: 2px solid #2e2e48;
      display: block;
      box-shadow: inset 0 0 16px rgba(255, 0, 85, 0.15);
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 9px;
      color: #8888aa;
      text-transform: uppercase;
      display: flex;
      gap: 16px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 20, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    .overlay h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #00ff66;
      margin-bottom: 12px;
      text-shadow: 0 0 8px #00ff66;
      text-align: center;
    }
    .btn {
      background: #00ff66;
      color: #000;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 10px 20px;
      border: none;
      box-shadow: 3px 3px 0px #000;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #66ffaa; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="hud">
      <div class="hud-hi">HI <span id="hiVal">00000</span></div>
      <div class="hud-score"><span id="scoreVal">00000</span></div>
    </div>
    <canvas id="dinoCanvas" width="600" height="200"></canvas>
    <div class="controls-hint">
      <span>🚀 SPACEBAR / TAP TO JUMP</span>
      <span>⬇️ DOWN ARROW TO CROUCH</span>
    </div>

    <div class="overlay" id="startOverlay">
      <h2>CYBER T-REX RUNNER</h2>
      <p style="color:#00e5ff; font-size:10px; margin-bottom:12px;">OUTRUN THE SYNTHWAVE HORIZON</p>
      <button class="btn" id="startBtn">START SPRINT</button>
    </div>

    <div class="overlay" id="gameOverOverlay" style="display:none;">
      <h2 style="color:#ff0055; text-shadow:0 0 8px #ff0055;">SYSTEM CRASH</h2>
      <p style="font-size:12px; color:#fff; margin-bottom:8px;">SCORE: <span id="finalScore">00000</span></p>
      <button class="btn" id="restartBtn">REBOOT RUNNER</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function getAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function playBeep(f, dur, type = 'square') {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }
    function playJump() { playBeep(380, 0.12, 'square'); }
    function playScore() { playBeep(750, 0.15, 'triangle'); }
    function playCrash() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    const canvas = document.getElementById('dinoCanvas');
    const ctx = canvas.getContext('2d');
    const GROUND_Y = 160;

    let isPlaying = false;
    let isGameOver = false;
    let score = 0;
    let highScore = 0;
    let speed = 5.0;
    let groundOffset = 0;

    // Dino Object
    const dino = {
      x: 45,
      y: GROUND_Y,
      width: 24,
      height: 32,
      vy: 0,
      jumpForce: -10.5,
      gravity: 0.55,
      isGrounded: true,
      isDucking: false,
      legFrame: 0
    };

    let obstacles = [];
    let clouds = [];
    let nextObstacleTimer = 60;

    function initEnvironment() {
      clouds = [
        { x: 100, y: 35, speed: 0.8 },
        { x: 300, y: 50, speed: 0.5 },
        { x: 500, y: 25, speed: 0.7 }
      ];
      obstacles = [];
      nextObstacleTimer = 70;
    }

    function spawnObstacle() {
      const type = Math.random() < 0.25 && score > 250 ? 'bird' : 'cactus';
      if (type === 'cactus') {
        const count = Math.random() < 0.3 ? 2 : 1;
        obstacles.push({
          type: 'cactus',
          x: canvas.width + 20,
          y: GROUND_Y - 26,
          width: 14 * count,
          height: 26,
          color: '#00ff66'
        });
      } else {
        // Pterodactyl flying
        const flyY = Math.random() < 0.5 ? GROUND_Y - 42 : GROUND_Y - 22;
        obstacles.push({
          type: 'bird',
          x: canvas.width + 20,
          y: flyY,
          width: 26,
          height: 16,
          color: '#ff0055',
          wingFrame: 0
        });
      }
    }

    function update() {
      if (!isPlaying || isGameOver) return;

      score += 0.25;
      const currentScoreInt = Math.floor(score);
      document.getElementById('scoreVal').textContent = String(currentScoreInt).padStart(5, '0');
      if (currentScoreInt > 0 && currentScoreInt % 100 === 0 && Math.floor(score - 0.25) % 100 !== 0) {
        playScore();
      }

      speed = 5.0 + Math.min(6.0, score * 0.005);
      groundOffset = (groundOffset + speed) % 24;

      // Dino physics
      if (!dino.isGrounded) {
        dino.vy += dino.gravity;
        dino.y += dino.vy;
        if (dino.y >= GROUND_Y) {
          dino.y = GROUND_Y;
          dino.vy = 0;
          dino.isGrounded = true;
        }
      } else {
        dino.legFrame = (dino.legFrame + 0.2) % 2;
      }

      // Clouds
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -60) c.x = canvas.width + Math.random() * 80;
      });

      // Obstacles
      nextObstacleTimer--;
      if (nextObstacleTimer <= 0) {
        spawnObstacle();
        nextObstacleTimer = 55 + Math.random() * 60;
      }

      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= speed;
        if (obs.type === 'bird') obs.wingFrame = (obs.wingFrame + 0.15) % 2;

        if (obs.x + obs.width < -10) {
          obstacles.splice(i, 1);
          continue;
        }

        // Collision Check
        const dinoH = dino.isDucking ? 18 : 32;
        const dinoY = dino.isDucking ? dino.y - 18 : dino.y - 32;
        const dinoW = dino.isDucking ? 30 : 22;

        if (dino.x + dinoW > obs.x + 4 &&
            dino.x < obs.x + obs.width - 4 &&
            dinoY + dinoH > obs.y + 4 &&
            dinoY < obs.y + obs.height) {
          triggerGameOver();
        }
      }
    }

    function jump() {
      if (dino.isGrounded && isPlaying && !isGameOver) {
        dino.vy = dino.jumpForce;
        dino.isGrounded = false;
        playJump();
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      isPlaying = false;
      playCrash();
      const finalScoreInt = Math.floor(score);
      if (finalScoreInt > highScore) {
        highScore = finalScoreInt;
        document.getElementById('hiVal').textContent = String(highScore).padStart(5, '0');
      }
      document.getElementById('finalScore').textContent = String(finalScoreInt).padStart(5, '0');
      document.getElementById('gameOverOverlay').style.display = 'flex';

      try {
        window.parent.postMessage({
          type: 'EDGEPLAY_GAME_OVER',
          gameId: 't-rex-runner',
          score: finalScoreInt
        }, '*');
      } catch (e) {}
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = '#1e1e34';
      clouds.forEach(c => {
        ctx.fillRect(c.x, c.y, 40, 10);
        ctx.fillRect(c.x + 8, c.y - 6, 24, 6);
      });

      // Ground Line
      ctx.strokeStyle = '#2e2e48';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, GROUND_Y);
      ctx.lineTo(canvas.width, GROUND_Y);
      ctx.stroke();

      // Ground bumps
      ctx.fillStyle = '#3a3a58';
      for (let x = -groundOffset; x < canvas.width; x += 24) {
        ctx.fillRect(x, GROUND_Y + 4, 10, 2);
        ctx.fillRect(x + 14, GROUND_Y + 8, 4, 2);
      }

      // Draw Dino
      ctx.fillStyle = '#00ff66';
      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 6;

      if (!dino.isDucking) {
        // Upright Dino
        const topY = dino.y - 32;
        // Head
        ctx.fillRect(dino.x + 8, topY, 14, 12);
        // Eye
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(dino.x + 16, topY + 2, 3, 3);
        ctx.fillStyle = '#00ff66';
        // Body
        ctx.fillRect(dino.x + 2, topY + 10, 12, 14);
        // Little arm
        ctx.fillRect(dino.x + 14, topY + 14, 4, 3);
        // Legs
        if (dino.isGrounded) {
          if (Math.floor(dino.legFrame) === 0) {
            ctx.fillRect(dino.x + 4, topY + 24, 4, 8);
            ctx.fillRect(dino.x + 10, topY + 24, 4, 4);
          } else {
            ctx.fillRect(dino.x + 4, topY + 24, 4, 4);
            ctx.fillRect(dino.x + 10, topY + 24, 4, 8);
          }
        } else {
          ctx.fillRect(dino.x + 4, topY + 24, 4, 5);
          ctx.fillRect(dino.x + 10, topY + 24, 4, 7);
        }
      } else {
        // Ducking Dino
        const topY = dino.y - 18;
        ctx.fillRect(dino.x, topY + 4, 28, 8);
        ctx.fillRect(dino.x + 18, topY, 12, 10);
        ctx.fillStyle = '#0a0a14';
        ctx.fillRect(dino.x + 24, topY + 2, 2, 2);
        ctx.fillStyle = '#00ff66';
        ctx.fillRect(dino.x + 4, topY + 12, 4, 6);
        ctx.fillRect(dino.x + 14, topY + 12, 4, 6);
      }

      // Draw Obstacles
      obstacles.forEach(obs => {
        ctx.fillStyle = obs.color;
        ctx.shadowColor = obs.color;
        ctx.shadowBlur = 6;
        if (obs.type === 'cactus') {
          // Neon Cactus
          ctx.fillRect(obs.x + 4, obs.y, obs.width - 8, obs.height);
          ctx.fillRect(obs.x, obs.y + 6, 4, 10);
          ctx.fillRect(obs.x + obs.width - 4, obs.y + 4, 4, 10);
        } else {
          // Cyber Pterodactyl
          const flap = Math.floor(obs.wingFrame) === 0 ? -4 : 4;
          ctx.fillRect(obs.x + 4, obs.y + 4, 16, 6);
          ctx.fillRect(obs.x + 16, obs.y + 2, 8, 4);
          // Wing
          ctx.fillRect(obs.x + 8, obs.y + 4 + flap, 8, 4);
        }
      });
      ctx.shadowBlur = 0;

      requestAnimationFrame(loop);
    }

    function loop() {
      update();
      draw();
    }

    // Input Listeners
    window.addEventListener('keydown', e => {
      getAudio();
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        jump();
      }
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        dino.isDucking = true;
      }
    });

    window.addEventListener('keyup', e => {
      if (['ArrowDown', 'KeyS'].includes(e.code)) {
        dino.isDucking = false;
      }
    });

    // Touch support (screen tap = jump)
    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      getAudio();
      jump();
    }, { passive: false });

    document.getElementById('startBtn').onclick = () => {
      getAudio();
      document.getElementById('startOverlay').style.display = 'none';
      score = 0;
      speed = 5.0;
      initEnvironment();
      isPlaying = true;
      isGameOver = false;
    };

    document.getElementById('restartBtn').onclick = () => {
      getAudio();
      document.getElementById('gameOverOverlay').style.display = 'none';
      score = 0;
      speed = 5.0;
      initEnvironment();
      isPlaying = true;
      isGameOver = false;
    };

    initEnvironment();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
