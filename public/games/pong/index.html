<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Pong 1972</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #06060c;
      color: #00e5ff;
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .game-box {
      background: #0e0e18;
      border: 3px solid #2e2e48;
      box-shadow: 4px 4px 0px #000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
    }
    .p1-score { color: #00e5ff; text-shadow: 0 0 8px #00e5ff; }
    .p2-score { color: #ff0055; text-shadow: 0 0 8px #ff0055; }
    canvas {
      background: #020206;
      border: 2px solid #2e2e48;
      display: block;
      box-shadow: inset 0 0 16px rgba(0, 229, 255, 0.15);
      cursor: ns-resize;
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 9px;
      color: #8888aa;
      text-transform: uppercase;
      display: flex;
      gap: 16px;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 10, 20, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    .overlay h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #00e5ff;
      margin-bottom: 12px;
      text-shadow: 0 0 8px #00e5ff;
      text-align: center;
    }
    .btn {
      background: #00e5ff;
      color: #000;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 10px 20px;
      border: none;
      box-shadow: 3px 3px 0px #000;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #66efff; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="hud">
      <div class="p1-score" id="p1Score">0</div>
      <div style="font-size:11px; color:#444466;">FIRST TO 7</div>
      <div class="p2-score" id="p2Score">0</div>
    </div>
    <canvas id="pongCanvas" width="500" height="340"></canvas>
    <div class="controls-hint">
      <span>🕹️ W/S OR MOUSE/TOUCH TO SLIDE</span>
      <span>⚡ HIT AT EDGES FOR CURVE SPIN</span>
    </div>

    <div class="overlay" id="startOverlay">
      <h2>CYBER PONG 1972</h2>
      <p style="color:#ffcc00; font-size:10px; margin-bottom:12px;">HUMAN VS OVERCLOCKED AI</p>
      <button class="btn" id="startBtn">START MATCH</button>
    </div>

    <div class="overlay" id="gameOverOverlay" style="display:none;">
      <h2 id="winnerText" style="color:#00ff66;">VICTORY</h2>
      <p style="font-size:11px; color:#fff; margin-bottom:8px;">FINAL: <span id="finalP1">0</span> - <span id="finalP2">0</span></p>
      <button class="btn" id="restartBtn">REMATCH</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function getAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function playBeep(f, dur, type = 'square') {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, ctx.currentTime);
        gain.gain.setValueAtTime(0.09, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }
    function playPaddleHit() { playBeep(480, 0.08, 'square'); }
    function playWallHit() { playBeep(240, 0.06, 'triangle'); }
    function playPoint() { playBeep(720, 0.2, 'sawtooth'); }

    const canvas = document.getElementById('pongCanvas');
    const ctx = canvas.getContext('2d');

    const PADDLE_W = 10;
    const PADDLE_H = 60;
    const WINNING_SCORE = 7;

    let p1 = { x: 20, y: canvas.height / 2 - PADDLE_H / 2, score: 0, vy: 0 };
    let p2 = { x: canvas.width - 30, y: canvas.height / 2 - PADDLE_H / 2, score: 0, speed: 3.6 };
    let ball = { x: canvas.width / 2, y: canvas.height / 2, size: 8, vx: 4, vy: 2 };
    let isPlaying = false;
    let isGameOver = false;

    function resetBall(direction) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;
      ball.vx = direction * 4.5;
      ball.vy = (Math.random() - 0.5) * 4;
    }

    function update() {
      if (!isPlaying || isGameOver) return;

      // Player Movement
      p1.y += p1.vy;
      p1.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p1.y));

      // AI Movement (tracks ball with reaction delay)
      const targetY = ball.y - PADDLE_H / 2;
      if (p2.y + PADDLE_H / 2 < ball.y - 6) {
        p2.y += p2.speed;
      } else if (p2.y + PADDLE_H / 2 > ball.y + 6) {
        p2.y -= p2.speed;
      }
      p2.y = Math.max(0, Math.min(canvas.height - PADDLE_H, p2.y));

      // Ball Movement
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Top / Bottom Wall Collision
      if (ball.y <= 0 || ball.y + ball.size >= canvas.height) {
        ball.vy = -ball.vy;
        playWallHit();
      }

      // Left Paddle Collision (Player 1)
      if (ball.x <= p1.x + PADDLE_W && ball.x + ball.size >= p1.x &&
          ball.y + ball.size >= p1.y && ball.y <= p1.y + PADDLE_H) {
        const hitOffset = (ball.y + ball.size / 2) - (p1.y + PADDLE_H / 2);
        ball.vx = Math.abs(ball.vx) * 1.05; // speed up
        ball.vy = hitOffset * 0.15;
        playPaddleHit();
      }

      // Right Paddle Collision (AI)
      if (ball.x + ball.size >= p2.x && ball.x <= p2.x + PADDLE_W &&
          ball.y + ball.size >= p2.y && ball.y <= p2.y + PADDLE_H) {
        const hitOffset = (ball.y + ball.size / 2) - (p2.y + PADDLE_H / 2);
        ball.vx = -Math.abs(ball.vx) * 1.05;
        ball.vy = hitOffset * 0.15;
        playPaddleHit();
      }

      // Score Check
      if (ball.x < 0) {
        p2.score++;
        playPoint();
        document.getElementById('p2Score').textContent = p2.score;
        if (p2.score >= WINNING_SCORE) {
          endGame(false);
        } else {
          resetBall(1);
        }
      } else if (ball.x > canvas.width) {
        p1.score++;
        playPoint();
        document.getElementById('p1Score').textContent = p1.score;
        if (p1.score >= WINNING_SCORE) {
          endGame(true);
        } else {
          resetBall(-1);
        }
      }
    }

    function endGame(playerWon) {
      isGameOver = true;
      isPlaying = false;
      document.getElementById('winnerText').textContent = playerWon ? 'VICTORY' : 'DEFEAT';
      document.getElementById('winnerText').style.color = playerWon ? '#00ff66' : '#ff0055';
      document.getElementById('finalP1').textContent = p1.score;
      document.getElementById('finalP2').textContent = p2.score;
      document.getElementById('gameOverOverlay').style.display = 'flex';

      try {
        window.parent.postMessage({
          type: 'EDGEPLAY_GAME_OVER',
          gameId: 'cyber-pong',
          score: p1.score * 1000 - p2.score * 200
        }, '*');
      } catch (e) {}
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Center Dotted Line
      ctx.strokeStyle = '#222238';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // P1 Paddle (Cyan Neon)
      ctx.fillStyle = '#00e5ff';
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 8;
      ctx.fillRect(p1.x, p1.y, PADDLE_W, PADDLE_H);

      // P2 Paddle (Magenta Neon)
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 8;
      ctx.fillRect(p2.x, p2.y, PADDLE_W, PADDLE_H);

      // Ball (Glowing Square)
      ctx.fillStyle = '#ffcc00';
      ctx.shadowColor = '#ffcc00';
      ctx.shadowBlur = 10;
      ctx.fillRect(ball.x, ball.y, ball.size, ball.size);
      ctx.shadowBlur = 0;

      requestAnimationFrame(loop);
    }

    function loop() {
      update();
      draw();
    }

    // Controls
    window.addEventListener('keydown', e => {
      getAudio();
      if (['KeyW', 'ArrowUp'].includes(e.code)) p1.vy = -5.5;
      if (['KeyS', 'ArrowDown'].includes(e.code)) p1.vy = 5.5;
    });
    window.addEventListener('keyup', e => {
      if (['KeyW', 'ArrowUp', 'KeyS', 'ArrowDown'].includes(e.code)) p1.vy = 0;
    });

    // Mouse / Touch Drag
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      p1.y = e.clientY - rect.top - PADDLE_H / 2;
    });
    canvas.addEventListener('touchmove', e => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      p1.y = e.touches[0].clientY - rect.top - PADDLE_H / 2;
    }, { passive: false });

    document.getElementById('startBtn').onclick = () => {
      getAudio();
      document.getElementById('startOverlay').style.display = 'none';
      p1.score = 0; p2.score = 0;
      document.getElementById('p1Score').textContent = '0';
      document.getElementById('p2Score').textContent = '0';
      resetBall(1);
      isPlaying = true;
      isGameOver = false;
    };

    document.getElementById('restartBtn').onclick = () => {
      getAudio();
      document.getElementById('gameOverOverlay').style.display = 'none';
      p1.score = 0; p2.score = 0;
      document.getElementById('p1Score').textContent = '0';
      document.getElementById('p2Score').textContent = '0';
      resetBall(1);
      isPlaying = true;
      isGameOver = false;
    };

    resetBall(1);
    requestAnimationFrame(loop);
  </script>
</body>
</html>
