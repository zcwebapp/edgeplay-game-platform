<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Brick Drop Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a14;
      color: #fff;
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .game-layout {
      display: flex;
      gap: 16px;
      background: #161626;
      border: 3px solid #2e2e48;
      box-shadow: 4px 4px 0px #000;
      padding: 16px;
      align-items: flex-start;
      position: relative;
    }
    canvas#tetris {
      background: #06060c;
      border: 2px solid #2e2e48;
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 110px;
    }
    .hud-box {
      background: #0a0a14;
      border: 2px solid #2e2e48;
      padding: 8px;
      text-align: center;
    }
    .hud-label {
      font-size: 9px;
      color: #8888aa;
      margin-bottom: 4px;
      text-transform: uppercase;
    }
    .hud-val {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #ffcc00;
    }
    .btn-action {
      background: #ffcc00;
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: bold;
      border: 2px solid #000;
      padding: 6px 8px;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
    }
    .btn-action:hover { background: #ffe066; }
    .overlay {
      position: absolute;
      inset: 16px;
      background: rgba(10, 10, 20, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 2px solid #ff0055;
      z-index: 10;
    }
    .overlay h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #ff0055;
      margin-bottom: 12px;
      text-shadow: 0 0 8px #ff0055;
    }
  </style>
</head>
<body>
  <div class="game-layout">
    <canvas id="tetris" width="200" height="400"></canvas>
    
    <div class="side-panel">
      <div class="hud-box">
        <div class="hud-label">Score</div>
        <div id="score" class="hud-val">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Lines</div>
        <div id="lines" class="hud-val">0</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">Level</div>
        <div id="level" class="hud-val">1</div>
      </div>
      <button class="btn-action" onclick="resetGame()">RESTART</button>
      <div style="font-size: 9px; color: #666; margin-top: 10px; line-height: 1.4;">
        [◀/▶] Move<br>
        [▲] Rotate<br>
        [▼] Soft Drop<br>
        [SPACE] Hard Drop
      </div>
    </div>

    <div class="overlay" id="overlay">
      <h2>GAME OVER</h2>
      <p style="font-size: 11px; color: #aaa; margin-bottom: 12px;">SCORE: <span id="finalScore" style="color: #ffcc00;">0</span></p>
      <button class="btn-action" onclick="resetGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const COLS = 10, ROWS = 20, BLOCK_SIZE = 20;

    const COLORS = [
      null,
      '#00e5ff', // I - Cyan
      '#0055ff', // J - Blue
      '#ffaa00', // L - Orange
      '#ffcc00', // O - Yellow
      '#00ff66', // S - Green
      '#9d4edd', // T - Purple
      '#ff0055'  // Z - Red
    ];

    const PIECES = 'ILJOTSZ';
    function createPiece(type) {
      if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
      if (type === 'J') return [[0,2,0],[0,2,0],[2,2,0]];
      if (type === 'L') return [[0,3,0],[0,3,0],[0,3,3]];
      if (type === 'O') return [[4,4],[4,4]];
      if (type === 'S') return [[0,5,5],[5,5,0],[0,0,0]];
      if (type === 'T') return [[0,6,0],[6,6,6],[0,0,0]];
      if (type === 'Z') return [[7,7,0],[0,7,7],[0,0,0]];
    }

    let arena = createMatrix(COLS, ROWS);
    let player = { pos: { x: 0, y: 0 }, matrix: null, score: 0, lines: 0, level: 1 };
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let isGameOver = false;

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function collide(arena, player) {
      const [m, o] = [player.matrix, player.pos];
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function arenaSweep() {
      let rowCount = 0;
      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;
        rowCount++;
      }
      if (rowCount > 0) {
        const points = [0, 100, 300, 500, 800];
        player.score += (points[rowCount] || 1000) * player.level;
        player.lines += rowCount;
        player.level = Math.floor(player.lines / 10) + 1;
        dropInterval = Math.max(150, 800 - (player.level - 1) * 70);
        updateScore();
      }
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      dropCounter = 0;
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerReset() {
      const randChar = PIECES[Math.floor(Math.random() * PIECES.length)];
      player.matrix = createPiece(randChar);
      player.pos.y = 0;
      player.pos.x = Math.floor(COLS / 2) - Math.floor(player.matrix[0].length / 2);
      if (collide(arena, player)) {
        isGameOver = true;
        document.getElementById('finalScore').textContent = player.score;
        document.getElementById('overlay').style.display = 'flex';
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'GAME_OVER', game_id: 'tetris-classic', score: player.score }, '*');
        }
      }
    }

    function updateScore() {
      document.getElementById('score').textContent = player.score;
      document.getElementById('lines').textContent = player.lines;
      document.getElementById('level').textContent = player.level;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'SCORE_UPDATE', game_id: 'tetris-classic', score: player.score }, '*');
      }
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            ctx.fillStyle = COLORS[value];
            ctx.fillRect((x + offset.x) * BLOCK_SIZE, (y + offset.y) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
            ctx.strokeStyle = '#000';
            ctx.strokeRect((x + offset.x) * BLOCK_SIZE, (y + offset.y) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
          }
        });
      });
    }

    function draw() {
      ctx.fillStyle = '#06060c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, { x: 0, y: 0 });
      if (player.matrix) drawMatrix(player.matrix, player.pos);
    }

    function update(time = 0) {
      if (isGameOver) return;
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function resetGame() {
      arena = createMatrix(COLS, ROWS);
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      dropInterval = 800;
      isGameOver = false;
      document.getElementById('overlay').style.display = 'none';
      updateScore();
      playerReset();
      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', e => {
      if (isGameOver) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { e.preventDefault(); playerMove(-1); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { e.preventDefault(); playerMove(1); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); playerDrop(); }
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); playerRotate(1); }
      else if (e.code === 'Space') { e.preventDefault(); playerHardDrop(); }
    });

    resetGame();
  </script>
</body>
</html>
