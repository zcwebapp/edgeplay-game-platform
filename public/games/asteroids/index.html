<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vector Asteroids 1979</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #06060c;
      color: #00ff66;
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .game-box {
      background: #0c0c16;
      border: 3px solid #2e2e48;
      box-shadow: 4px 4px 0px #000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
    }
    .hud-score { color: #fff; text-shadow: 0 0 6px #00ff66; }
    .hud-lives { color: #00e5ff; }
    canvas {
      background: #020205;
      border: 2px solid #2e2e48;
      display: block;
      box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.15);
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 9px;
      color: #8888aa;
      text-transform: uppercase;
      display: flex;
      gap: 14px;
    }
    .touch-controls {
      display: none;
      gap: 12px;
      margin-top: 8px;
    }
    @media (max-width: 600px) {
      .touch-controls { display: flex; }
    }
    .tbtn {
      background: #1a1a2e;
      border: 2px solid #444466;
      color: #00ff66;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 10px 14px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tbtn:active { background: #00ff66; color: #000; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(6, 6, 12, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    .overlay h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #00ff66;
      margin-bottom: 12px;
      text-align: center;
      text-shadow: 0 0 8px #00ff66;
    }
    .btn {
      background: #00ff66;
      color: #000;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 10px 20px;
      border: none;
      box-shadow: 3px 3px 0px #000;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn:hover { background: #66ffaa; }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="hud">
      <div class="hud-score">SCORE: <span id="scoreVal">0</span></div>
      <div class="hud-lives">SHIPS: <span id="livesVal">▲ ▲ ▲</span></div>
    </div>
    <canvas id="astCanvas" width="460" height="420"></canvas>
    <div class="controls-hint">
      <span>🕹️ ◀/▶ ROTATE · ▲ THRUST</span>
      <span>💥 SPACEBAR TO FIRE</span>
    </div>
    <div class="touch-controls">
      <button class="tbtn" id="btnRotL">◀</button>
      <button class="tbtn" id="btnThrust">▲</button>
      <button class="tbtn" id="btnRotR">▶</button>
      <button class="tbtn" id="btnFire" style="background:#ff0055; color:#fff;">FIRE</button>
    </div>

    <div class="overlay" id="startOverlay">
      <h2>VECTOR ASTEROIDS</h2>
      <p style="color:#00e5ff; font-size:10px; margin-bottom:12px;">INERTIAL THRUST SPACE NAVIGATION</p>
      <button class="btn" id="startBtn">START ENGINES</button>
    </div>

    <div class="overlay" id="gameOverOverlay" style="display:none;">
      <h2 style="color:#ff0055; text-shadow:0 0 8px #ff0055;">SHIP DESTROYED</h2>
      <p style="font-size:12px; color:#fff; margin-bottom:8px;">FINAL SCORE: <span id="finalScore">0</span></p>
      <button class="btn" id="restartBtn">RESTART</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function getAudio() {
      if (!actx) actx = new AudioCtx();
      if (actx.state === 'suspended') actx.resume();
      return actx;
    }
    function playLaser() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }
    function playBoom(dur = 0.25) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, ctx.currentTime + dur);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + dur);
      } catch (e) {}
    }

    const canvas = document.getElementById('astCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let isPlaying = false;
    let isGameOver = false;

    // Vector Starship
    const ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: 0,
      vy: 0,
      angle: -Math.PI / 2,
      rotSpeed: 0,
      thrust: false,
      radius: 12,
      invuln: 0
    };

    let asteroids = [];
    let bullets = [];
    let particles = [];

    function createAsteroid(x, y, radius, level = 3) {
      const numPoints = 8 + Math.floor(Math.random() * 4);
      const offsets = [];
      for (let i = 0; i < numPoints; i++) {
        offsets.push(radius * (0.8 + Math.random() * 0.4));
      }
      const angle = Math.random() * Math.PI * 2;
      const speed = 0.6 + (4 - level) * 0.5;
      return {
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius,
        level, // 3: large, 2: medium, 1: small
        numPoints,
        offsets
      };
    }

    function initAsteroids() {
      asteroids = [];
      for (let i = 0; i < 5; i++) {
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (Math.hypot(x - ship.x, y - ship.y) < 100);
        asteroids.push(createAsteroid(x, y, 32, 3));
      }
    }

    function createExplosion(x, y, count = 12, color = '#00ff66') {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.5 + Math.random() * 3;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          life: 20 + Math.random() * 15,
          maxLife: 35
        });
      }
    }

    function update() {
      if (!isPlaying || isGameOver) return;

      // Ship Rotation
      ship.angle += ship.rotSpeed;

      // Ship Thrust
      if (ship.thrust) {
        ship.vx += Math.cos(ship.angle) * 0.12;
        ship.vy += Math.sin(ship.angle) * 0.12;
        // Thrust flame particles
        if (Math.random() < 0.6) {
          particles.push({
            x: ship.x - Math.cos(ship.angle) * 12,
            y: ship.y - Math.sin(ship.angle) * 12,
            vx: -Math.cos(ship.angle) * (1 + Math.random() * 2) + (Math.random() - 0.5),
            vy: -Math.sin(ship.angle) * (1 + Math.random() * 2) + (Math.random() - 0.5),
            color: '#ffcc00',
            life: 10,
            maxLife: 10
          });
        }
      }

      // Inertial Drag & Motion
      ship.vx *= 0.985;
      ship.vy *= 0.985;
      ship.x += ship.vx;
      ship.y += ship.vy;

      // Wrap boundaries
      if (ship.x < 0) ship.x = canvas.width;
      if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      if (ship.y > canvas.height) ship.y = 0;
      if (ship.invuln > 0) ship.invuln--;

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        b.life--;
        if (b.x < 0) b.x = canvas.width;
        if (b.x > canvas.width) b.x = 0;
        if (b.y < 0) b.y = canvas.height;
        if (b.y > canvas.height) b.y = 0;

        if (b.life <= 0) { bullets.splice(i, 1); continue; }

        // Bullet vs Asteroid collision
        for (let j = asteroids.length - 1; j >= 0; j--) {
          const a = asteroids[j];
          if (Math.hypot(b.x - a.x, b.y - a.y) < a.radius) {
            bullets.splice(i, 1);
            score += a.level === 3 ? 20 : (a.level === 2 ? 50 : 100);
            document.getElementById('scoreVal').textContent = score;
            playBoom(a.level === 3 ? 0.3 : 0.15);
            createExplosion(a.x, a.y, a.level * 6);

            // Split into 2 smaller asteroids if not smallest
            if (a.level > 1) {
              const nextRadius = a.level === 3 ? 18 : 10;
              asteroids.push(createAsteroid(a.x, a.y, nextRadius, a.level - 1));
              asteroids.push(createAsteroid(a.x, a.y, nextRadius, a.level - 1));
            }
            asteroids.splice(j, 1);
            break;
          }
        }
      }

      // Check if all asteroids cleared -> new wave!
      if (asteroids.length === 0) {
        score += 1000;
        document.getElementById('scoreVal').textContent = score;
        initAsteroids();
      }

      // Asteroids motion & Ship collision
      for (let i = 0; i < asteroids.length; i++) {
        const a = asteroids[i];
        a.x += a.vx;
        a.y += a.vy;
        if (a.x < -a.radius) a.x = canvas.width + a.radius;
        if (a.x > canvas.width + a.radius) a.x = -a.radius;
        if (a.y < -a.radius) a.y = canvas.height + a.radius;
        if (a.y > canvas.height + a.radius) a.y = -a.radius;

        // Collision with ship
        if (ship.invuln <= 0 && Math.hypot(ship.x - a.x, ship.y - a.y) < ship.radius + a.radius) {
          lives--;
          document.getElementById('livesVal').textContent = '▲ '.repeat(Math.max(0, lives));
          playBoom(0.4);
          createExplosion(ship.x, ship.y, 20, '#00e5ff');
          ship.x = canvas.width / 2;
          ship.y = canvas.height / 2;
          ship.vx = 0;
          ship.vy = 0;
          ship.invuln = 120; // 2 seconds invulnerable
          if (lives <= 0) {
            triggerGameOver();
          }
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function fireLaser() {
      if (isPlaying && !isGameOver && bullets.length < 5) {
        bullets.push({
          x: ship.x + Math.cos(ship.angle) * ship.radius,
          y: ship.y + Math.sin(ship.angle) * ship.radius,
          vx: Math.cos(ship.angle) * 7 + ship.vx * 0.4,
          vy: Math.sin(ship.angle) * 7 + ship.vy * 0.4,
          life: 55
        });
        playLaser();
      }
    }

    function triggerGameOver() {
      isGameOver = true;
      isPlaying = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverOverlay').style.display = 'flex';

      try {
        window.parent.postMessage({
          type: 'EDGEPLAY_GAME_OVER',
          gameId: 'vector-asteroids',
          score: score
        }, '*');
      } catch (e) {}
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Vector Asteroids
      ctx.strokeStyle = '#00ff66';
      ctx.lineWidth = 1.8;
      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 6;
      asteroids.forEach(a => {
        ctx.beginPath();
        for (let i = 0; i < a.numPoints; i++) {
          const ang = (i / a.numPoints) * Math.PI * 2;
          const r = a.offsets[i];
          const px = a.x + Math.cos(ang) * r;
          const py = a.y + Math.sin(ang) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      });

      // Draw Bullets
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';
      ctx.shadowBlur = 8;
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 4;
        ctx.fillRect(p.x, p.y, 2, 2);
      });

      // Draw Ship
      if (ship.invuln % 10 < 5) {
        ctx.save();
        ctx.translate(ship.x, ship.y);
        ctx.rotate(ship.angle);
        ctx.strokeStyle = '#00e5ff';
        ctx.shadowColor = '#00e5ff';
        ctx.shadowBlur = 8;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(ship.radius, 0);
        ctx.lineTo(-ship.radius, -ship.radius * 0.7);
        ctx.lineTo(-ship.radius * 0.5, 0);
        ctx.lineTo(-ship.radius, ship.radius * 0.7);
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      ctx.shadowBlur = 0;
      requestAnimationFrame(loop);
    }

    function loop() {
      update();
      draw();
    }

    // Input Listeners
    window.addEventListener('keydown', e => {
      getAudio();
      if (['ArrowLeft', 'KeyA'].includes(e.code)) ship.rotSpeed = -0.07;
      if (['ArrowRight', 'KeyD'].includes(e.code)) ship.rotSpeed = 0.07;
      if (['ArrowUp', 'KeyW'].includes(e.code)) ship.thrust = true;
      if (e.code === 'Space') {
        e.preventDefault();
        fireLaser();
      }
    });

    window.addEventListener('keyup', e => {
      if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) ship.rotSpeed = 0;
      if (['ArrowUp', 'KeyW'].includes(e.code)) ship.thrust = false;
    });

    // Touch button bindings
    const setupTBtn = (id, onDown, onUp) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', e => { e.preventDefault(); getAudio(); onDown(); });
      el.addEventListener('touchend', e => { e.preventDefault(); if (onUp) onUp(); });
    };
    setupTBtn('btnRotL', () => ship.rotSpeed = -0.07, () => ship.rotSpeed = 0);
    setupTBtn('btnRotR', () => ship.rotSpeed = 0.07, () => ship.rotSpeed = 0);
    setupTBtn('btnThrust', () => ship.thrust = true, () => ship.thrust = false);
    setupTBtn('btnFire', () => fireLaser());

    document.getElementById('startBtn').onclick = () => {
      getAudio();
      document.getElementById('startOverlay').style.display = 'none';
      score = 0;
      lives = 3;
      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('livesVal').textContent = '▲ ▲ ▲';
      ship.x = canvas.width / 2; ship.y = canvas.height / 2;
      ship.vx = 0; ship.vy = 0; ship.angle = -Math.PI / 2;
      initAsteroids();
      bullets = [];
      particles = [];
      isPlaying = true;
      isGameOver = false;
    };

    document.getElementById('restartBtn').onclick = () => {
      getAudio();
      document.getElementById('gameOverOverlay').style.display = 'none';
      score = 0;
      lives = 3;
      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('livesVal').textContent = '▲ ▲ ▲';
      ship.x = canvas.width / 2; ship.y = canvas.height / 2;
      ship.vx = 0; ship.vy = 0; ship.angle = -Math.PI / 2;
      initAsteroids();
      bullets = [];
      particles = [];
      isPlaying = true;
      isGameOver = false;
    };

    initAsteroids();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
