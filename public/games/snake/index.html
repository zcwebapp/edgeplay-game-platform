<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake 1984</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0a0a14;
      color: #00ff66;
      font-family: 'Space Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: none;
    }
    .game-box {
      background: #12121d;
      border: 3px solid #2e2e48;
      box-shadow: 4px 4px 0px #000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }
    .hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
    }
    .hud-score { color: #00ff66; text-shadow: 0 0 5px #00ff66; }
    .hud-high { color: #ffcc00; text-shadow: 0 0 5px #ffcc00; }
    canvas {
      background: #06060c;
      border: 2px solid #2e2e48;
      display: block;
      box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
    }
    .overlay {
      position: absolute;
      inset: 45px 12px 12px 12px;
      background: rgba(10, 10, 20, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      border: 2px solid #ff0055;
    }
    .overlay h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #ff0055;
      margin-bottom: 12px;
      text-shadow: 0 0 8px #ff0055;
    }
    .btn-action {
      background: #00ff66;
      color: #000;
      font-family: 'Space Mono', monospace;
      font-weight: bold;
      border: 2px solid #000;
      padding: 6px 14px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #000;
      font-size: 12px;
    }
    .btn-action:hover { background: #55ff99; }
    .dpad-touch {
      display: none;
      grid-template-columns: repeat(3, 40px);
      grid-gap: 5px;
      margin-top: 10px;
    }
    .dpad-btn {
      width: 40px; height: 40px;
      background: #1b1b25;
      color: #fff;
      border: 2px solid #2e2e48;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    @media (pointer: coarse) {
      .dpad-touch { display: grid; }
    }
  </style>
</head>
<body>
  <div class="game-box">
    <div class="hud">
      <div class="hud-score">SCORE: <span id="score">0</span></div>
      <div class="hud-high">HI: <span id="hi-score">0</span></div>
    </div>
    <canvas id="c" width="360" height="360"></canvas>
    
    <div class="overlay" id="overlay">
      <h2 id="overlayTitle">SYSTEM FAILURE</h2>
      <p style="font-size: 12px; color: #aaa; margin-bottom: 12px;">FINAL SCORE: <span id="finalScore" style="color: #00ff66; font-weight: bold;">0</span></p>
      <button class="btn-action" onclick="startGame()">PRESS TO REBOOT</button>
    </div>

    <div class="dpad-touch">
      <div></div>
      <div class="dpad-btn" onclick="setDir(0, -1)">▲</div>
      <div></div>
      <div class="dpad-btn" onclick="setDir(-1, 0)">◀</div>
      <div class="dpad-btn" onclick="startGame()">●</div>
      <div class="dpad-btn" onclick="setDir(1, 0)">▶</div>
      <div></div>
      <div class="dpad-btn" onclick="setDir(0, 1)">▼</div>
      <div></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const gridSize = 18;
    const tileCount = canvas.width / gridSize;

    let snake = [];
    let food = { x: 5, y: 5 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let hiScore = parseInt(localStorage.getItem('snake_hi') || '0', 10);
    document.getElementById('hi-score').textContent = hiScore;

    let gameLoop = null;
    let isGameOver = false;

    function startGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      isGameOver = false;
      document.getElementById('score').textContent = score;
      document.getElementById('overlay').style.display = 'none';
      spawnFood();

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function setDir(newDx, newDy) {
      if ((newDx === -dx && newDx !== 0) || (newDy === -dy && newDy !== 0)) return;
      nextDx = newDx;
      nextDy = newDy;
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        triggerGameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        triggerGameOver();
        return;
      }

      snake.unshift(head);

      // Eat Food
      if (head.x === food.x && head.y === food.y) {
        score += 100;
        document.getElementById('score').textContent = score;
        if (score > hiScore) {
          hiScore = score;
          document.getElementById('hi-score').textContent = hiScore;
          localStorage.setItem('snake_hi', hiScore);
        }
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'SCORE_UPDATE', game_id: 'cyber-snake', score: score }, '*');
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      // Clear background
      ctx.fillStyle = '#06060c';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid dots
      ctx.fillStyle = 'rgba(46, 46, 72, 0.4)';
      for (let x = 0; x < canvas.width; x += gridSize) {
        for (let y = 0; y < canvas.height; y += gridSize) {
          ctx.fillRect(x + gridSize / 2, y + gridSize / 2, 1, 1);
        }
      }

      // Draw Food (Neon Cyber Orb)
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 8;
      ctx.fillRect(food.x * gridSize + 2, food.y * gridSize + 2, gridSize - 4, gridSize - 4);
      ctx.shadowBlur = 0;

      // Draw Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#00ff66';
          ctx.shadowColor = '#00ff66';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = '#00cc52';
          ctx.shadowBlur = 0;
        }
        ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
      });
      ctx.shadowBlur = 0;
    }

    function triggerGameOver() {
      clearInterval(gameLoop);
      isGameOver = true;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('overlay').style.display = 'flex';
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'GAME_OVER', game_id: 'cyber-snake', score: score }, '*');
      }
    }

    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDir(0, -1); }
      if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDir(0, 1); }
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDir(-1, 0); }
      if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDir(1, 0); }
      if (e.code === 'Space' && isGameOver) { startGame(); }
    });

    startGame();
  </script>
</body>
</html>
