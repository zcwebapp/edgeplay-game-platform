<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cookieDough" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e8b974"/>
      <stop offset="60%" stop-color="#c68a4c"/>
      <stop offset="100%" stop-color="#8b572a"/>
    </radialGradient>
    <radialGradient id="cookieAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0e0a16" stop-opacity="0"/>
    </radialGradient>
    <filter id="cookieGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Bakery Night Background -->
  <rect width="600" height="400" fill="#0e0a16"/>
  <!-- Golden Aura behind Cookie -->
  <circle cx="300" cy="210" r="180" fill="url(#cookieAura)"/>

  <!-- Big Title -->
  <g filter="url(#cookieGlow)">
    <text x="300" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" font-weight="900" fill="#f5a623" text-anchor="middle" letter-spacing="3">COOKIE CLICKER</text>
    <text x="300" y="53" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">COOKIE CLICKER</text>
  </g>
  <text x="300" y="80" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#00ff66" text-anchor="middle" letter-spacing="3">1,489,204,500 COOKIES BAKED</text>

  <!-- Giant Golden Cookie in Center -->
  <g transform="translate(300, 220)" filter="url(#cookieGlow)">
    <!-- Base Cookie Circle with crinkled edges -->
    <circle cx="0" cy="0" r="105" fill="url(#cookieDough)" stroke="#663b15" stroke-width="3"/>

    <!-- Chocolate Chips -->
    <ellipse cx="-45" cy="-35" rx="14" ry="11" fill="#381d09" transform="rotate(20)"/>
    <ellipse cx="25" cy="-55" rx="16" ry="12" fill="#381d09" transform="rotate(-15)"/>
    <ellipse cx="-20" cy="15" rx="15" ry="13" fill="#381d09"/>
    <ellipse cx="50" cy="10" rx="14" ry="10" fill="#381d09" transform="rotate(40)"/>
    <ellipse cx="-55" cy="45" rx="12" ry="10" fill="#381d09" transform="rotate(-25)"/>
    <ellipse cx="15" cy="55" rx="16" ry="12" fill="#381d09" transform="rotate(10)"/>
    <ellipse cx="-5" cy="-60" rx="11" ry="8" fill="#381d09"/>
    <ellipse cx="65" cy="-30" rx="12" ry="9" fill="#381d09" transform="rotate(-30)"/>

    <!-- Chocolate Chip Highlights -->
    <circle cx="-47" cy="-37" r="3" fill="#5c381c"/>
    <circle cx="23" cy="-57" r="3" fill="#5c381c"/>
    <circle cx="-22" cy="13" r="3" fill="#5c381c"/>
    <circle cx="48" cy="8" r="3" fill="#5c381c"/>

    <!-- Cookie Cracks and Texture -->
    <path d="M -60 -10 Q -30 -15 0 -5" stroke="#75461c" stroke-width="2" fill="none"/>
    <path d="M 20 20 Q 40 35 60 25" stroke="#75461c" stroke-width="2" fill="none"/>
  </g>

  <!-- Golden Click Mouse Pointer -->
  <g transform="translate(380, 240) rotate(-20)" filter="url(#cookieGlow)">
    <polygon points="0,0 0,35 10,25 22,35 27,30 15,20 25,20" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
  </g>

  <!-- Floating +1 / +999 Cookies Click Sparkles -->
  <g filter="url(#cookieGlow)">
    <text x="210" y="150" font-family="'Impact', Arial" font-size="22" font-weight="bold" fill="#00ff66">+1</text>
    <text x="390" y="160" font-family="'Impact', Arial" font-size="26" font-weight="bold" fill="#ffe600">+999</text>
    <text x="300" y="360" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" fill="#ff7700" text-anchor="middle" letter-spacing="2">PER SECOND: +42.5M CpS</text>
  </g>
</svg>
