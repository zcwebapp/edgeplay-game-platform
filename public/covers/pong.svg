<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <filter id="pongGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Screen with CRT border -->
  <rect width="600" height="400" fill="#020202"/>

  <!-- Top / Bottom Arena Borders -->
  <line x1="20" y1="20" x2="580" y2="20" stroke="#ffffff" stroke-width="8" opacity="0.8"/>
  <line x1="20" y1="380" x2="580" y2="380" stroke="#ffffff" stroke-width="8" opacity="0.8"/>

  <!-- Center Dashed Net Line -->
  <line x1="300" y1="20" x2="300" y2="380" stroke="#ffffff" stroke-width="6" stroke-dasharray="14,14" opacity="0.4"/>

  <!-- Scoreboard -->
  <text x="210" y="90" font-family="'Courier New', monospace" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.9" filter="url(#pongGlow)">07</text>
  <text x="390" y="90" font-family="'Courier New', monospace" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.9" filter="url(#pongGlow)">04</text>

  <!-- Left Player Paddle (Cyan) -->
  <g filter="url(#pongGlow)">
    <rect x="50" y="160" width="14" height="85" rx="3" fill="#00f3ff"/>
  </g>

  <!-- Right AI Paddle (Pink/Red) -->
  <g filter="url(#pongGlow)">
    <rect x="536" y="210" width="14" height="85" rx="3" fill="#ff0055"/>
  </g>

  <!-- Bouncing Ball with Kinetic Motion Trail -->
  <line x1="160" y1="250" x2="380" y2="185" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,8" opacity="0.5"/>
  <g filter="url(#pongGlow)">
    <rect x="380" y="180" width="16" height="16" fill="#ffffff"/>
  </g>

  <!-- Title Bottom -->
  <g filter="url(#pongGlow)">
    <text x="300" y="330" font-family="'Impact', 'Arial Black', monospace" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">CYBER PONG</text>
  </g>
  <text x="300" y="355" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00f3ff" text-anchor="middle" letter-spacing="4">1972 ATARI ARCADE LEGEND</text>
</svg>
