<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mineBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#080a10"/>
    </linearGradient>
    <filter id="mineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#mineBg)"/>

  <!-- Title -->
  <g filter="url(#mineGlow)">
    <text x="300" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="4">CYBER MINESWEEPER</text>
  </g>
  <text x="300" y="78" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#ff0055" text-anchor="middle" letter-spacing="3">TACTICAL HAZARD SWEEPER</text>

  <!-- Status Bar LED Digits -->
  <rect x="150" y="95" width="80" height="34" rx="4" fill="#000000" stroke="#333333"/>
  <text x="190" y="119" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#ff0000" text-anchor="middle">💣010</text>

  <rect x="370" y="95" width="80" height="34" rx="4" fill="#000000" stroke="#333333"/>
  <text x="410" y="119" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#ff0000" text-anchor="middle">⏱️042</text>

  <!-- Classic Face Icon -->
  <circle cx="300" cy="112" r="16" fill="#ffe600" stroke="#333333" stroke-width="2"/>
  <!-- Sunglasses (Cool Face) -->
  <rect x="290" y="106" width="9" height="7" rx="2" fill="#000000"/>
  <rect x="301" y="106" width="9" height="7" rx="2" fill="#000000"/>
  <line x1="298" y1="109" x2="302" y2="109" stroke="#000000" stroke-width="2"/>
  <path d="M 294 120 Q 300 125 306 120" stroke="#000000" stroke-width="2" fill="none"/>

  <!-- Minesweeper Grid -->
  <g transform="translate(150, 145)">
    <!-- Unopened Cells (3D beveled appearance) -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="34" height="34" fill="#3a4055" rx="3" stroke="#262b3d"/>
    <text x="17" y="24" font-family="'Segoe UI Black', Arial" font-size="20" font-weight="900" fill="#00aaff" text-anchor="middle">1</text>

    <rect x="38" y="0" width="34" height="34" fill="#3a4055" rx="3" stroke="#262b3d"/>
    <text x="55" y="24" font-family="'Segoe UI Black', Arial" font-size="20" font-weight="900" fill="#00ff66" text-anchor="middle">2</text>

    <rect x="76" y="0" width="34" height="34" fill="#3a4055" rx="3" stroke="#262b3d"/>
    <text x="93" y="24" font-family="'Segoe UI Black', Arial" font-size="20" font-weight="900" fill="#ff0055" text-anchor="middle">3</text>

    <!-- Flagged Cell -->
    <rect x="114" y="0" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <!-- Flag -->
    <path d="M 125 10 L 137 15 L 125 20 Z" fill="#ff0055"/>
    <line x1="125" y1="10" x2="125" y2="28" stroke="#ffffff" stroke-width="2"/>

    <rect x="152" y="0" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="190" y="0" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="228" y="0" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="266" y="0" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>

    <!-- Row 2 -->
    <rect x="0" y="38" width="34" height="34" fill="#3a4055" rx="3" stroke="#262b3d"/>
    <text x="17" y="62" font-family="'Segoe UI Black', Arial" font-size="20" font-weight="900" fill="#00aaff" text-anchor="middle">1</text>

    <!-- Spiked Naval Mine in center -->
    <g transform="translate(190, 76)" filter="url(#mineGlow)">
      <circle cx="17" cy="17" r="10" fill="#111111" stroke="#ff0055" stroke-width="2"/>
      <circle cx="17" cy="17" r="4" fill="#ff0055"/>
      <!-- Spikes -->
      <line x1="17" y1="3" x2="17" y2="31" stroke="#ff0055" stroke-width="2"/>
      <line x1="3" y1="17" x2="31" y2="17" stroke="#ff0055" stroke-width="2"/>
      <line x1="7" y1="7" x2="27" y2="27" stroke="#ff0055" stroke-width="2"/>
      <line x1="7" y1="27" x2="27" y2="7" stroke="#ff0055" stroke-width="2"/>
    </g>

    <rect x="38" y="38" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="76" y="38" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="114" y="38" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="152" y="38" width="34" height="34" fill="#3a4055" rx="3" stroke="#262b3d"/>
    <text x="169" y="62" font-family="'Segoe UI Black', Arial" font-size="20" font-weight="900" fill="#00aaff" text-anchor="middle">1</text>
    <rect x="228" y="38" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="266" y="38" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>

    <!-- Row 3 -->
    <rect x="0" y="76" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="38" y="76" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="76" y="76" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="114" y="76" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="152" y="76" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="228" y="76" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="266" y="76" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>

    <!-- Row 4 -->
    <rect x="0" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="38" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="76" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="114" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="152" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="190" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="228" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="266" y="114" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>

    <!-- Row 5 -->
    <rect x="0" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="38" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="76" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="114" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="152" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="190" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="228" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
    <rect x="266" y="152" width="34" height="34" fill="#505a75" rx="3" stroke="#262b3d"/>
  </g>
</svg>
