<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02010a"/>
      <stop offset="50%" stop-color="#090520"/>
      <stop offset="100%" stop-color="#140838"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="600" height="400" fill="url(#spaceBg)"/>

  <!-- Starfield -->
  <g fill="#ffffff">
    <circle cx="45" cy="50" r="1.5" opacity="0.8"/>
    <circle cx="120" cy="180" r="1" opacity="0.6"/>
    <circle cx="85" cy="290" r="2" opacity="0.9"/>
    <circle cx="210" cy="70" r="1.2" opacity="0.7"/>
    <circle cx="370" cy="40" r="1.8" opacity="0.85"/>
    <circle cx="510" cy="110" r="1.5" opacity="0.9"/>
    <circle cx="460" cy="260" r="1" opacity="0.5"/>
    <circle cx="540" cy="330" r="2" opacity="0.7"/>
    <circle cx="180" cy="360" r="1.5" opacity="0.6"/>
    <circle cx="330" cy="380" r="1" opacity="0.8"/>
  </g>

  <!-- Alien Fleet (Top Formation) -->
  <!-- Alien Boss (Red/Purple) -->
  <g transform="translate(270, 70)" filter="url(#laserGlow)">
    <path d="M 0 15 L 15 0 L 45 0 L 60 15 L 50 35 L 30 25 L 10 35 Z" fill="#ff0055" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="22" cy="15" r="4" fill="#00ffff"/>
    <circle cx="38" cy="15" r="4" fill="#00ffff"/>
  </g>

  <!-- Alien Escorts (Yellow/Green) -->
  <g transform="translate(180, 110)" filter="url(#laserGlow)">
    <path d="M 0 10 L 15 0 L 30 10 L 25 25 L 5 25 Z" fill="#ffe600"/>
    <circle cx="15" cy="12" r="3" fill="#ff0055"/>
  </g>
  <g transform="translate(390, 110)" filter="url(#laserGlow)">
    <path d="M 0 10 L 15 0 L 30 10 L 25 25 L 5 25 Z" fill="#ffe600"/>
    <circle cx="15" cy="12" r="3" fill="#ff0055"/>
  </g>

  <!-- Exploding Alien on Left -->
  <g transform="translate(120, 100)" fill="#ff7700" opacity="0.9">
    <circle cx="15" cy="15" r="8"/>
    <line x1="15" y1="0" x2="15" y2="30" stroke="#ffdd00" stroke-width="2"/>
    <line x1="0" y1="15" x2="30" y2="15" stroke="#ffdd00" stroke-width="2"/>
    <line x1="5" y1="5" x2="25" y2="25" stroke="#ff0055" stroke-width="2"/>
  </g>

  <!-- Twin Blue Lasers Firing -->
  <g filter="url(#laserGlow)">
    <line x1="285" y1="280" x2="285" y2="140" stroke="#00f3ff" stroke-width="3"/>
    <line x1="315" y1="280" x2="315" y2="140" stroke="#00f3ff" stroke-width="3"/>
    <line x1="285" y1="280" x2="285" y2="140" stroke="#ffffff" stroke-width="1"/>
    <line x1="315" y1="280" x2="315" y2="140" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Player Starship -->
  <g transform="translate(270, 275)" filter="url(#laserGlow)">
    <!-- Wings & Hull -->
    <path d="M 30 0 L 40 25 L 60 50 L 50 65 L 35 55 L 30 65 L 25 55 L 10 65 L 0 50 L 20 25 Z" fill="#0066ff" stroke="#00f3ff" stroke-width="2"/>
    <!-- Cockpit Canopy -->
    <ellipse cx="30" cy="30" rx="6" ry="14" fill="#00ffff"/>
    <!-- Engine Jet Thruster Flames -->
    <polygon points="26,65 30,85 34,65" fill="#ffaa00"/>
    <polygon points="28,65 30,78 32,65" fill="#ffffff"/>
  </g>

  <!-- Title & Typography -->
  <g filter="url(#laserGlow)">
    <text x="300" y="42" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="4">GALACTIC GUARDIAN</text>
    <text x="300" y="40" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GALACTIC GUARDIAN</text>
  </g>
  <text x="300" y="380" font-family="'Courier New', monospace" font-size="13" font-weight="bold" fill="#00f3ff" text-anchor="middle" letter-spacing="4">ARCADE SPACE SHMUP</text>
</svg>
