<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hextrisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191d26"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <filter id="hexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#hextrisBg)"/>

  <!-- Title Header -->
  <g filter="url(#hexGlow)">
    <text x="300" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" font-weight="900" fill="#00f3ff" text-anchor="middle" letter-spacing="4">HEXTRIS</text>
    <text x="300" y="53" font-family="'Impact', 'Arial Black', sans-serif" font-size="40" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HEXTRIS</text>
  </g>
  <text x="300" y="80" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#fa4454" text-anchor="middle" letter-spacing="3">HEXAGONAL PUZZLE SPEED</text>

  <!-- Central Hexagonal Ring & Colored Blocks -->
  <g transform="translate(300, 230)" filter="url(#hexGlow)">
    <!-- Outer Inbound Blocks -->
    <!-- Segment 1: Red -->
    <path d="M -90 -120 L -30 -140 L -25 -125 L -75 -108 Z" fill="#fa4454"/>
    <!-- Segment 2: Blue -->
    <path d="M 40 -130 L 100 -100 L 85 -90 L 35 -115 Z" fill="#2c94e8"/>
    <!-- Segment 3: Yellow -->
    <path d="M 115 10 L 125 70 L 110 65 L 102 12 Z" fill="#fbb03b"/>
    <!-- Segment 4: Green -->
    <path d="M 20 120 L -40 135 L -35 120 L 16 108 Z" fill="#00e575"/>

    <!-- Middle Hexagon Layers Stacked on Sides -->
    <!-- Layer 2 -->
    <polygon points="0,-85 74,-42 74,42 0,85 -74,42 -74,-42" fill="none" stroke="#2c3240" stroke-width="2"/>

    <!-- Colored Stacked Arcs -->
    <!-- Side 1: Top Red -->
    <polygon points="-50,-55 0,-85 50,-55 42,-44 0,-68 -42,-44" fill="#fa4454"/>
    <!-- Side 2: Top Right Blue -->
    <polygon points="50,-55 74,-12 62,-10 42,-44" fill="#2c94e8"/>
    <!-- Side 3: Bottom Right Yellow -->
    <polygon points="74,12 50,55 42,44 62,10" fill="#fbb03b"/>
    <!-- Side 4: Bottom Green -->
    <polygon points="50,55 0,85 -50,55 -42,44 0,68 42,44" fill="#00e575"/>
    <!-- Side 5: Bottom Left Blue -->
    <polygon points="-50,55 -74,12 -62,10 -42,44" fill="#2c94e8"/>

    <!-- Core Center Hexagon -->
    <polygon points="0,-40 35,-20 35,20 0,40 -35,20 -35,-20" fill="#1b202a" stroke="#ffffff" stroke-width="2.5"/>
    <!-- Inner Dot -->
    <circle cx="0" cy="0" r="6" fill="#00f3ff"/>
  </g>
</svg>
