<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <radialGradient id="fireGlowGrad" cx="50%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#ff7b00" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ff3300" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#661100" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pitch Black Room -->
  <rect width="600" height="400" fill="#050505"/>

  <!-- Campfire Radial Ambient Light -->
  <rect width="600" height="400" fill="url(#fireGlowGrad)"/>

  <!-- Campfire Logs & Embers -->
  <g transform="translate(300, 260)">
    <!-- Crossed Logs -->
    <rect x="-45" y="-5" width="90" height="14" rx="4" fill="#3d2314" transform="rotate(-15)"/>
    <rect x="-45" y="-5" width="90" height="14" rx="4" fill="#2b180d" transform="rotate(20)"/>

    <!-- Glowing Coals -->
    <ellipse cx="0" cy="5" rx="35" ry="10" fill="#ff3700" filter="url(#flameGlow)"/>

    <!-- Flickering Flames -->
    <!-- Outer Flame -->
    <path d="M 0 -80 Q -35 -20 -25 10 Q 0 20 25 10 Q 35 -20 0 -80 Z" fill="#ff6600" filter="url(#flameGlow)"/>
    <!-- Inner Flame -->
    <path d="M 0 -60 Q -20 -15 -15 8 Q 0 15 15 8 Q 20 -15 0 -60 Z" fill="#ffcc00"/>
    <!-- Core White Flame -->
    <path d="M 0 -40 Q -10 -10 -8 5 Q 0 10 8 5 Q 10 -10 0 -40 Z" fill="#ffffff"/>

    <!-- Floating Sparks & Embers -->
    <circle cx="-12" cy="-95" r="2.5" fill="#ffcc00"/>
    <circle cx="8" cy="-110" r="1.8" fill="#ff6600"/>
    <circle cx="-25" cy="-130" r="1.5" fill="#ffcc00"/>
    <circle cx="18" cy="-145" r="2" fill="#ffaa00"/>
    <circle cx="2" cy="-160" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Minimalist Narrative Text Box -->
  <rect x="100" y="35" width="400" height="75" rx="4" fill="#0d0d0d" stroke="#222222" stroke-width="1.5"/>
  <text x="120" y="62" font-family="'Courier New', monospace" font-size="14" fill="#aaaaaa">> the fire is dead.</text>
  <text x="120" y="86" font-family="'Courier New', monospace" font-size="14" fill="#00ff66">> the room is cold. stoke fire.</text>

  <!-- Title Bottom -->
  <text x="300" y="340" font-family="'Georgia', serif" font-size="34" font-weight="normal" fill="#e0e0e0" text-anchor="middle" letter-spacing="6">A DARK ROOM</text>
  <text x="300" y="365" font-family="'Courier New', monospace" font-size="12" fill="#888888" text-anchor="middle" letter-spacing="3">AN ATMOSPHERIC TEXT SURVIVAL RPG</text>
</svg>
