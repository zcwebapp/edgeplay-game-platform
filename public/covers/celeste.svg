<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="celesteSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <filter id="celesteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#celesteSky)"/>

  <!-- Snowy Mountain Silhouette -->
  <!-- Back Mountain -->
  <polygon points="120,400 300,120 480,400" fill="#1b2434"/>
  <polygon points="300,120 250,200 300,180 350,200" fill="#ffffff" opacity="0.8"/>

  <!-- Foreground Snowy Cliffs -->
  <polygon points="0,400 0,260 160,220 240,400" fill="#2d3748"/>
  <polygon points="0,260 160,220 180,240 0,280" fill="#e2e8f0"/>

  <polygon points="380,400 480,240 600,260 600,400" fill="#2d3748"/>
  <polygon points="480,240 600,260 600,280 460,260" fill="#e2e8f0"/>

  <!-- Pixel Snow Particles -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="80" cy="90" r="2"/>
    <circle cx="150" cy="140" r="1.5"/>
    <circle cx="230" cy="60" r="2.5"/>
    <circle cx="340" cy="95" r="1.8"/>
    <circle cx="430" cy="160" r="2"/>
    <circle cx="520" cy="80" r="1.5"/>
  </g>

  <!-- Winged Floating Golden Strawberry -->
  <g transform="translate(300, 190)" filter="url(#celesteGlow)">
    <!-- Strawberry body -->
    <path d="M 0 0 C -15 -15 -25 5 0 25 C 25 5 15 -15 0 0 Z" fill="#ff0055"/>
    <!-- Yellow seeds -->
    <circle cx="-5" cy="5" r="1.5" fill="#ffe600"/>
    <circle cx="5" cy="7" r="1.5" fill="#ffe600"/>
    <circle cx="0" cy="14" r="1.5" fill="#ffe600"/>
    <!-- Wings -->
    <path d="M -15 -2 Q -35 -18 -40 -2 Q -30 10 -15 4 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 15 -2 Q 35 -18 40 -2 Q 30 10 15 4 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Madeline Heroine Character (Dashing Upward) -->
  <g transform="translate(200, 260) rotate(-25)">
    <!-- Dash Ghost Trail -->
    <ellipse cx="-20" cy="10" rx="14" ry="10" fill="#00f3ff" opacity="0.4"/>
    <ellipse cx="-10" cy="5" rx="15" ry="12" fill="#00f3ff" opacity="0.6"/>
    <!-- Red Flying Hair -->
    <path d="M -12 -5 Q -35 5 -45 25 Q -25 20 -10 10 Z" fill="#ff2244"/>
    <!-- Head -->
    <circle cx="5" cy="0" r="10" fill="#ffdfba"/>
    <circle cx="8" cy="-1" r="2" fill="#222222"/>
    <!-- Blue Coat & Body -->
    <rect x="-4" y="8" width="16" height="18" rx="4" fill="#00a8ff"/>
    <!-- Boots -->
    <rect x="-8" y="24" width="8" height="6" rx="2" fill="#8b572a"/>
    <rect x="8" y="24" width="8" height="6" rx="2" fill="#8b572a"/>
  </g>

  <!-- Title & Typography -->
  <g filter="url(#celesteGlow)">
    <text x="300" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CELESTE CLASSIC</text>
  </g>
  <text x="300" y="80" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#00f3ff" text-anchor="middle" letter-spacing="3">PICO-8 PLATFORMER LEGEND</text>
</svg>
