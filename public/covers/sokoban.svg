<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sokobanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b172b"/>
      <stop offset="100%" stop-color="#0a0812"/>
    </linearGradient>
    <filter id="crateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="400" fill="url(#sokobanBg)"/>

  <!-- Title -->
  <g filter="url(#crateGlow)">
    <text x="300" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#f5a623" text-anchor="middle" letter-spacing="4">CYBER SOKOBAN</text>
    <text x="300" y="53" font-family="'Impact', 'Arial Black', sans-serif" font-size="36" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">CYBER SOKOBAN</text>
  </g>
  <text x="300" y="78" font-family="'Courier New', monospace" font-size="12" font-weight="bold" fill="#00f3ff" text-anchor="middle" letter-spacing="3">CRATE PUSHER TACTICS</text>

  <!-- Warehouse Maze Arena Layout -->
  <g transform="translate(130, 110)">
    <!-- Floor Tiles Grid -->
    <rect x="0" y="0" width="340" height="240" fill="#141120" rx="8" stroke="#37314d" stroke-width="2"/>

    <!-- Brick Walls -->
    <rect x="10" y="10" width="40" height="40" rx="4" fill="#443d5c" stroke="#252133"/>
    <rect x="50" y="10" width="40" height="40" rx="4" fill="#443d5c" stroke="#252133"/>
    <rect x="90" y="10" width="40" height="40" rx="4" fill="#443d5c" stroke="#252133"/>
    <rect x="130" y="10" width="40" height="40" rx="4" fill="#443d5c" stroke="#252133"/>
    <rect x="170" y="10" width="40" height="40" rx="4" fill="#443d5c" stroke="#252133"/>

    <!-- Target Spot (Green Crosshair Pad) -->
    <g filter="url(#crateGlow)">
      <circle cx="70" cy="110" r="14" fill="none" stroke="#00ff66" stroke-width="3"/>
      <circle cx="70" cy="110" r="4" fill="#00ff66"/>
      <circle cx="70" cy="190" r="14" fill="none" stroke="#00ff66" stroke-width="3"/>
      <circle cx="70" cy="190" r="4" fill="#00ff66"/>
    </g>

    <!-- Successfully Placed Crate (Glowing Green) -->
    <g transform="translate(50, 90)" filter="url(#crateGlow)">
      <rect width="40" height="40" rx="4" fill="#00aa44" stroke="#00ff66" stroke-width="2"/>
      <line x1="0" y1="0" x2="40" y2="40" stroke="#00ff66" stroke-width="2"/>
      <line x1="40" y1="0" x2="0" y2="40" stroke="#00ff66" stroke-width="2"/>
    </g>

    <!-- Normal Wooden / Tech Crate (Golden Amber) -->
    <g transform="translate(150, 130)" filter="url(#crateGlow)">
      <rect width="44" height="44" rx="4" fill="#b06d15" stroke="#f5a623" stroke-width="2.5"/>
      <line x1="0" y1="0" x2="44" y2="44" stroke="#f5a623" stroke-width="2"/>
      <line x1="44" y1="0" x2="0" y2="44" stroke="#f5a623" stroke-width="2"/>
      <rect x="10" y="10" width="24" height="24" fill="none" stroke="#ffe082" stroke-width="1.5"/>
    </g>

    <!-- Player / Robot Character pushing the crate -->
    <g transform="translate(210, 130)">
      <!-- Robot Body -->
      <rect x="10" y="6" width="26" height="32" rx="6" fill="#00f3ff" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Robot Eyes (Looking left) -->
      <circle cx="16" cy="15" r="3.5" fill="#000000"/>
      <circle cx="24" cy="15" r="3.5" fill="#000000"/>
      <circle cx="15" cy="14" r="1" fill="#ffffff"/>
      <circle cx="23" cy="14" r="1" fill="#ffffff"/>
      <!-- Pushing Hands reaching left -->
      <rect x="0" y="22" width="12" height="6" rx="2" fill="#00aacc"/>
    </g>
  </g>

  <!-- Level & Moves Badge -->
  <text x="300" y="375" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#f5a623" text-anchor="middle" letter-spacing="3">LEVEL: 05 / 20   MOVES: 18</text>
</svg>
