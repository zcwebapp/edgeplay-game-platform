<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ec0ca"/>
      <stop offset="65%" stop-color="#70c5ce"/>
      <stop offset="100%" stop-color="#ded895"/>
    </linearGradient>
    <!-- Pipe gradient -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73bf2e"/>
      <stop offset="40%" stop-color="#9ce659"/>
      <stop offset="85%" stop-color="#558022"/>
      <stop offset="100%" stop-color="#2e4c10"/>
    </linearGradient>
    <filter id="birdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="600" height="340" fill="url(#skyGrad)"/>

  <!-- Pixel Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <rect x="60" y="80" width="90" height="24" rx="10"/>
    <rect x="80" y="66" width="50" height="25" rx="12"/>
    <rect x="380" y="110" width="120" height="28" rx="12"/>
    <rect x="410" y="92" width="60" height="30" rx="14"/>
  </g>

  <!-- City Skyline Silhouette -->
  <path d="M 0 320 L 30 320 L 30 280 L 60 280 L 60 300 L 90 300 L 90 270 L 130 270 L 130 320 L 170 320 L 170 290 L 220 290 L 220 320 L 350 320 L 350 285 L 390 285 L 390 320 L 480 320 L 480 275 L 530 275 L 530 320 L 600 320 L 600 340 L 0 340 Z" fill="#b8e48b" opacity="0.6"/>

  <!-- Ground -->
  <rect x="0" y="340" width="600" height="60" fill="#ded895"/>
  <rect x="0" y="340" width="600" height="12" fill="#73bf2e"/>
  <line x1="0" y1="352" x2="600" y2="352" stroke="#558022" stroke-width="2"/>

  <!-- Left Top & Bottom Pipes -->
  <!-- Top Pipe 1 -->
  <rect x="100" y="-10" width="60" height="110" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>
  <rect x="94" y="90" width="72" height="25" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>
  <!-- Bottom Pipe 1 -->
  <rect x="94" y="215" width="72" height="25" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>
  <rect x="100" y="240" width="60" height="100" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>

  <!-- Right Top & Bottom Pipes -->
  <!-- Top Pipe 2 -->
  <rect x="420" y="-10" width="60" height="160" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>
  <rect x="414" y="140" width="72" height="25" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>
  <!-- Bottom Pipe 2 -->
  <rect x="414" y="265" width="72" height="25" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>
  <rect x="420" y="290" width="60" height="60" fill="url(#pipeGrad)" stroke="#2e4c10" stroke-width="2"/>

  <!-- Flappy Bird Character in Center Flight -->
  <g transform="translate(250, 160) rotate(-10)" filter="url(#birdGlow)">
    <!-- Bird Body -->
    <ellipse cx="25" cy="20" rx="22" ry="17" fill="#fcd116" stroke="#222222" stroke-width="2"/>
    <!-- Belly (lighter yellow) -->
    <ellipse cx="22" cy="26" rx="14" ry="9" fill="#fff48d"/>
    <!-- Wing -->
    <ellipse cx="12" cy="18" rx="10" ry="7" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <!-- Big Eye -->
    <circle cx="34" cy="14" r="8" fill="#ffffff" stroke="#222222" stroke-width="2"/>
    <circle cx="36" cy="14" r="3.5" fill="#000000"/>
    <circle cx="38" cy="12" r="1.5" fill="#ffffff"/>
    <!-- Orange Beak / Lips -->
    <path d="M 40 18 Q 54 22 42 27 Z" fill="#f25322" stroke="#222222" stroke-width="2"/>
    <line x1="40" y1="22" x2="48" y2="22" stroke="#222222" stroke-width="1.5"/>
  </g>

  <!-- Title Banner -->
  <text x="300" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#ffffff" stroke="#222222" stroke-width="3" text-anchor="middle" letter-spacing="3">PIXEL FLAP BIRD</text>
  <text x="300" y="55" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#fcd116" text-anchor="middle" letter-spacing="3">PIXEL FLAP BIRD</text>
</svg>
